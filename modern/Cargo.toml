[workspace]
resolver = "2"
members = [
    "crates/chunky-format",
    "crates/engine",
    "crates/renderer",
    "crates/audio",
    "crates/cli",
    "crates/wasm-bindings",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/benstone/3DMMEx"

[workspace.dependencies]
# Shared across crates
thiserror = "2"
byteorder = "1"
bitflags = "2"
log = "0.4"
env_logger = "0.11"

# Binary parsing
binrw = "0.14"

# 3D Rendering
wgpu = { version = "24", features = ["webgpu"] }
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"

# Audio
rodio = { version = "0.20", default-features = false, features = ["wav"] }
hound = "3"
midly = { version = "0.5", features = ["std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# PNG encoding (headless render → frontend)
png = "0.17"

# Base64 (PNG → data URL)
base64 = "0.22"

# Async channel (WASM-compatible readback)
futures-channel = "0.3"

# Testing
pretty_assertions = "1"
tempfile = "3"

# Chunky format (internal)
chunky-format = { path = "crates/chunky-format" }
engine = { path = "crates/engine" }
renderer = { path = "crates/renderer" }
audio = { path = "crates/audio" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
