[workspace]
resolver = "2"
members = [
    "crates/chunky-format",
    "crates/engine",
    "crates/renderer",
    "crates/audio",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/benstone/3DMMEx"

[workspace.dependencies]
# Shared across crates
thiserror = "2"
byteorder = "1"
bitflags = "2"
log = "0.4"
env_logger = "0.11"

# Binary parsing
binrw = "0.14"

# Testing
pretty_assertions = "1"
tempfile = "3"

# Chunky format (internal)
chunky-format = { path = "crates/chunky-format" }
engine = { path = "crates/engine" }
renderer = { path = "crates/renderer" }
audio = { path = "crates/audio" }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
