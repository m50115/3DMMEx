<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3DMMEx Web</title>
  <style>
    /* ── CSS custom properties — dark (default) ─────────────────── */
    :root {
      --bg:          #1a1a1a;
      --bg-elev:     #222;
      --bg-topbar:   #111;
      --bg-thumb:    #1a1a1a;
      --fg:          #eee;
      --fg-muted:    #888;
      --fg-dim:      #aaa;
      --fg-faint:    #666;
      --fg-faint2:   #444;
      --border:      #333;
      --border-ctrl: #555;
      --border-row:  #2a2a2a;
      --accent:      #6cf;
      --accent-bg:   #2a3f55;
      --accent-hover:#1e2a33;
      --btn-bg:      #333;
      --btn-bg-hover:#444;
      --error-fg:    #f88;
      --error-bg:    #2a1515;
    }

    /* ── Light theme overrides ───────────────────────────────────── */
    [data-theme="light"] {
      --bg:          #f5f5f5;
      --bg-elev:     #ffffff;
      --bg-topbar:   #e8e8e8;
      --bg-thumb:    #f0f0f0;
      --fg:          #1a1a1a;
      --fg-muted:    #555;
      --fg-dim:      #444;
      --fg-faint:    #777;
      --fg-faint2:   #999;
      --border:      #d0d0d0;
      --border-ctrl: #aaa;
      --border-row:  #e0e0e0;
      --accent:      #0077cc;
      --accent-bg:   #ddeeff;
      --accent-hover:#cce4f7;
      --btn-bg:      #ddd;
      --btn-bg-hover:#ccc;
      --error-fg:    #cc2200;
      --error-bg:    #ffeeee;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
    }
    #topbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--bg-topbar);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      height: 46px;
    }
    #topbar h1 { margin: 0; padding: 0; font-size: 1.1rem; background: none; border: none; }
    #res-label { font-size: 0.8rem; color: var(--fg-muted); margin-left: auto; }
    #res {
      background: var(--bg-elev); border: 1px solid var(--border-ctrl); color: var(--fg);
      padding: 3px 6px; border-radius: 3px; font-size: 0.82rem; cursor: pointer;
    }
    #res:focus { outline: 1px solid var(--accent); }
    #sample-picker {
      background: var(--bg-elev); border: 1px solid var(--border-ctrl); color: var(--fg);
      padding: 3px 6px; border-radius: 3px; font-size: 0.82rem; cursor: pointer;
      max-width: 160px;
    }
    #sample-picker:focus { outline: 1px solid var(--accent); }
    #theme-toggle {
      background: var(--btn-bg); border: 1px solid var(--border-ctrl); color: var(--fg);
      padding: 3px 8px; border-radius: 3px; font-size: 0.82rem; cursor: pointer;
      line-height: 1.4;
    }
    #theme-toggle:hover { background: var(--btn-bg-hover); }
    #drop {
      border: 2px dashed var(--border-ctrl);
      padding: 3rem 2rem;
      margin: 2rem;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    #drop.hover { border-color: var(--accent); background: var(--accent-hover); }
    #drop p { margin: 0.5rem 0 0; color: var(--fg-muted); font-size: 0.85rem; }
    #layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1rem;
      padding: 1rem;
      height: calc(100vh - 46px);
    }
    #sidebar { display: flex; flex-direction: column; gap: 1rem; overflow: auto; }
    #scenes-panel, #actors-panel {
      background: var(--bg-elev);
      border-radius: 6px;
      padding: 0.75rem;
    }
    #scenes-panel h2, #actors-panel h2 {
      margin: 0 0 0.5rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg-muted);
    }
    /* ── Scene thumbnail gallery ─────────────────────────────────── */
    #scene-thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, 160px);
      gap: 8px;
      margin-bottom: 0.75rem;
    }
    .scene-thumb-card {
      cursor: pointer;
      border-radius: 5px;
      overflow: hidden;
      border: 2px solid var(--border);
      transition: border-color 0.15s;
      background: var(--bg-topbar);
    }
    .scene-thumb-card:hover { border-color: var(--accent); }
    .scene-thumb-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .scene-thumb-card img {
      display: block;
      width: 160px;
      height: 120px;
      object-fit: cover;
    }
    .scene-thumb-card .thumb-placeholder {
      width: 160px;
      height: 120px;
      background: var(--bg-thumb);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--fg-faint2);
      font-size: 0.7rem;
    }
    .scene-thumb-card .thumb-label {
      padding: 3px 6px;
      font-size: 0.75rem;
      color: var(--fg-dim);
      background: var(--bg-thumb);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .scene-thumb-card.active .thumb-label { color: var(--accent); }
    /* ── Scene text list (accessibility fallback) ────────────────── */
    #scenes-text-toggle {
      font-size: 0.75rem;
      color: var(--fg-faint);
      cursor: pointer;
      margin-bottom: 4px;
      user-select: none;
    }
    #scenes-text-toggle:hover { color: var(--fg-muted); }
    #scenes-text-list { display: none; }
    .scene-row {
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .scene-row:hover { background: var(--btn-bg-hover); }
    .scene-row.active { background: var(--accent-bg); color: var(--accent); }
    .actor-row { padding: 4px; font-size: 0.8rem; color: var(--fg-dim); border-bottom: 1px solid var(--border-row); }
    .actor-row:last-child { border-bottom: none; }
    .actor-info { margin-bottom: 4px; }
    .actor-edit {
      display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap;
    }
    .actor-edit label {
      font-size: 0.75rem; color: var(--fg-muted); display: flex; align-items: center; gap: 3px;
    }
    .actor-edit input[type="number"] {
      width: 70px; background: var(--bg-thumb); border: 1px solid var(--border-ctrl); color: var(--fg);
      padding: 2px 4px; border-radius: 3px; font-size: 0.78rem;
    }
    .actor-edit input[type="number"]:focus { border-color: var(--accent); outline: none; }
    .apply-btn { padding: 3px 10px; font-size: 0.78rem; }
    #content-panel {
      background: var(--bg-elev);
      border-radius: 6px;
      padding: 0.75rem;
    }
    #content-panel h2 {
      margin: 0 0 0.5rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg-muted);
    }
    #tmpls-status { font-size: 0.8rem; color: var(--fg-muted); margin-bottom: 0.5rem; }
    #tmpls-status.loaded { color: #6f6; }
    #main-area { display: flex; flex-direction: column; gap: 0.75rem; }
    canvas {
      background: #000;
      display: block;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    #controls { display: flex; gap: 0.5rem; align-items: center; }
    button {
      background: var(--btn-bg);
      color: var(--fg);
      border: 1px solid var(--border-ctrl);
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { background: var(--btn-bg-hover); }
    #status { font-size: 0.8rem; color: var(--fg-muted); }
    #error { color: var(--error-fg); font-size: 0.85rem; padding: 0.5rem; background: var(--error-bg); border-radius: 4px; }

    /* Debug panel — only visible when [data-debug="1"] on <html>. */
    #debug-panel {
      position: fixed;
      bottom: 8px;
      right: 8px;
      max-width: 460px;
      max-height: 60vh;
      overflow: auto;
      margin: 0;
      padding: 8px 10px;
      background: rgba(0,0,0,0.78);
      color: #9f9;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      line-height: 1.35;
      border: 1px solid #2f2;
      border-radius: 4px;
      z-index: 9999;
      white-space: pre-wrap;
      word-break: break-word;
    }
    html[data-debug="1"] #debug-toggle::after { content: " ON"; color: #6f6; }
    #debug-toggle {
      background: var(--btn-bg); border: 1px solid var(--border-ctrl); color: var(--fg);
      padding: 3px 8px; border-radius: 3px; font-size: 0.82rem; cursor: pointer;
      line-height: 1.4;
    }
    #debug-toggle:hover { background: var(--btn-bg-hover); }
  </style>
</head>
<body>
  <div id="topbar">
    <h1>3DMMEx Web</h1>
    <span id="res-label">Resolución:</span>
    <select id="res">
      <option value="480p">480p (640×480)</option>
      <option value="720p">720p (1280×720)</option>
      <option value="1080p">1080p (1920×1080)</option>
    </select>
    <select id="sample-picker" title="Cargar movie de ejemplo">
      <option value="">— sample movie —</option>
    </select>
    <button id="theme-toggle" title="Toggle light/dark theme">🌙</button>
    <button id="debug-toggle" title="Toggle debug overlay + auto-dump">🐞 debug</button>
  </div>
  <div id="drop">
    <strong>Arrastra un archivo .3mm aquí</strong>
    <p>o haz click para seleccionar</p>
    <input type="file" id="file-input" accept=".3mm" style="display:none" />
  </div>
  <div id="layout" style="display:none">
    <div id="sidebar">
      <div id="scenes-panel">
        <h2>Escenas</h2>
        <div id="scene-thumbs"></div>
        <div id="scenes-text-toggle">▶ lista de texto</div>
        <div id="scenes-text-list">
          <div id="scenes"></div>
        </div>
      </div>
      <div id="actors-panel">
        <h2>Actores</h2>
        <div id="actors"></div>
      </div>
      <div id="content-panel">
        <h2>Archivos de contenido</h2>
        <div id="tmpls-status">tmpls.3cn: no cargado</div>
        <button id="load-tmpls-btn">Cargar tmpls.3cn…</button>
        <input type="file" id="tmpls-input" accept=".3cn" style="display:none" />
      </div>
    </div>
    <div id="main-area">
      <canvas id="viewport" width="640" height="480"></canvas>
      <div id="controls">
        <button id="download">&#128190; Descargar .3mm</button>
        <span id="status"></span>
      </div>
      <div id="error" style="display:none"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
