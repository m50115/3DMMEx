<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3DMMEx Web</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #1a1a1a;
      color: #eee;
      min-height: 100vh;
    }
    #topbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #111;
      border-bottom: 1px solid #333;
      padding: 0 1rem;
      height: 46px;
    }
    #topbar h1 { margin: 0; padding: 0; font-size: 1.1rem; background: none; border: none; }
    #res-label { font-size: 0.8rem; color: #888; margin-left: auto; }
    #res {
      background: #222; border: 1px solid #555; color: #eee;
      padding: 3px 6px; border-radius: 3px; font-size: 0.82rem; cursor: pointer;
    }
    #res:focus { outline: 1px solid #6cf; }
    #drop {
      border: 2px dashed #555;
      padding: 3rem 2rem;
      margin: 2rem;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    #drop.hover { border-color: #6cf; background: #1e2a33; }
    #drop p { margin: 0.5rem 0 0; color: #888; font-size: 0.85rem; }
    #layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1rem;
      padding: 1rem;
      height: calc(100vh - 46px);
    }
    #sidebar { display: flex; flex-direction: column; gap: 1rem; overflow: auto; }
    #scenes-panel, #actors-panel {
      background: #222;
      border-radius: 6px;
      padding: 0.75rem;
    }
    #scenes-panel h2, #actors-panel h2 {
      margin: 0 0 0.5rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
    }
    /* ── Scene thumbnail gallery ─────────────────────────────────── */
    #scene-thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, 160px);
      gap: 8px;
      margin-bottom: 0.75rem;
    }
    .scene-thumb-card {
      cursor: pointer;
      border-radius: 5px;
      overflow: hidden;
      border: 2px solid #333;
      transition: border-color 0.15s;
      background: #111;
    }
    .scene-thumb-card:hover { border-color: #6cf; }
    .scene-thumb-card.active { border-color: #6cf; box-shadow: 0 0 0 1px #6cf; }
    .scene-thumb-card img {
      display: block;
      width: 160px;
      height: 120px;
      object-fit: cover;
    }
    .scene-thumb-card .thumb-placeholder {
      width: 160px;
      height: 120px;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 0.7rem;
    }
    .scene-thumb-card .thumb-label {
      padding: 3px 6px;
      font-size: 0.75rem;
      color: #aaa;
      background: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .scene-thumb-card.active .thumb-label { color: #6cf; }
    /* ── Scene text list (accessibility fallback) ────────────────── */
    #scenes-text-toggle {
      font-size: 0.75rem;
      color: #666;
      cursor: pointer;
      margin-bottom: 4px;
      user-select: none;
    }
    #scenes-text-toggle:hover { color: #999; }
    #scenes-text-list { display: none; }
    .scene-row {
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .scene-row:hover { background: #333; }
    .scene-row.active { background: #2a3f55; color: #6cf; }
    .actor-row { padding: 4px; font-size: 0.8rem; color: #aaa; border-bottom: 1px solid #2a2a2a; }
    .actor-row:last-child { border-bottom: none; }
    .actor-info { margin-bottom: 4px; }
    .actor-edit {
      display: flex; gap: 0.35rem; align-items: center; flex-wrap: wrap;
    }
    .actor-edit label {
      font-size: 0.75rem; color: #888; display: flex; align-items: center; gap: 3px;
    }
    .actor-edit input[type="number"] {
      width: 70px; background: #1a1a1a; border: 1px solid #444; color: #eee;
      padding: 2px 4px; border-radius: 3px; font-size: 0.78rem;
    }
    .actor-edit input[type="number"]:focus { border-color: #6cf; outline: none; }
    .apply-btn { padding: 3px 10px; font-size: 0.78rem; }
    #content-panel {
      background: #222;
      border-radius: 6px;
      padding: 0.75rem;
    }
    #content-panel h2 {
      margin: 0 0 0.5rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
    }
    #tmpls-status { font-size: 0.8rem; color: #888; margin-bottom: 0.5rem; }
    #tmpls-status.loaded { color: #6f6; }
    #main-area { display: flex; flex-direction: column; gap: 0.75rem; }
    canvas {
      background: #000;
      display: block;
      border-radius: 4px;
      border: 1px solid #333;
    }
    #controls { display: flex; gap: 0.5rem; align-items: center; }
    button {
      background: #333;
      color: #eee;
      border: 1px solid #555;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    button:hover { background: #444; }
    #status { font-size: 0.8rem; color: #888; }
    #error { color: #f88; font-size: 0.85rem; padding: 0.5rem; background: #2a1515; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="topbar">
    <h1>3DMMEx Web</h1>
    <span id="res-label">Resolución:</span>
    <select id="res">
      <option value="480p">480p (640×480)</option>
      <option value="720p">720p (1280×720)</option>
      <option value="1080p">1080p (1920×1080)</option>
    </select>
  </div>
  <div id="drop">
    <strong>Arrastra un archivo .3mm aquí</strong>
    <p>o haz click para seleccionar</p>
    <input type="file" id="file-input" accept=".3mm" style="display:none" />
  </div>
  <div id="layout" style="display:none">
    <div id="sidebar">
      <div id="scenes-panel">
        <h2>Escenas</h2>
        <div id="scene-thumbs"></div>
        <div id="scenes-text-toggle">▶ lista de texto</div>
        <div id="scenes-text-list">
          <div id="scenes"></div>
        </div>
      </div>
      <div id="actors-panel">
        <h2>Actores</h2>
        <div id="actors"></div>
      </div>
      <div id="content-panel">
        <h2>Archivos de contenido</h2>
        <div id="tmpls-status">tmpls.3cn: no cargado</div>
        <button id="load-tmpls-btn">Cargar tmpls.3cn…</button>
        <input type="file" id="tmpls-input" accept=".3cn" style="display:none" />
      </div>
    </div>
    <div id="main-area">
      <canvas id="viewport" width="640" height="480"></canvas>
      <div id="controls">
        <button id="download">&#128190; Descargar .3mm</button>
        <span id="status"></span>
      </div>
      <div id="error" style="display:none"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
